<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Important Account Notice</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f1f5f9; font-family: 'Segoe UI', Arial, sans-serif; color: #1e293b; }
    .container { max-width: 600px; margin: 30px auto; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .header { padding: 30px; text-align: center; background-color: #001E2B; border-bottom: 1px solid #0f2d3c; }
    .header img { height: 32px; }
    .content { padding: 40px 30px; text-align: center; }
    .badge-icon { font-size: 48px; margin-bottom: 16px; }
    h1 { margin: 0 0 12px 0; font-size: 24px; font-weight: 700; color: #0f172a; }
    p { margin: 0 0 20px 0; font-size: 15px; line-height: 1.6; color: #475569; }
    .notice-card { background-color: #fef3c7; border: 1px solid #fde68a; border-radius: 12px; padding: 18px; margin: 0 0 24px 0; font-size: 14px; color: #92400e; text-align: left; line-height: 1.5; }
    .cta-button { display: inline-block; padding: 14px 32px; background-color: #D97706; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 15px; border-radius: 999px; }
    .footer { padding: 24px 30px; text-align: center; border-top: 1px solid #f1f5f9; font-size: 12px; color: #94a3b8; background-color: #f8fafc; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://tutoronline.pk/light%20logo.svg" alt="TutorOnline.pk">
    </div>
    <div class="content">
      <div class="badge-icon">🔔</div>
      <h1>Account Notice</h1>
      <p>Hello {{USER_NAME}}, there is an important update regarding your TutorOnline account.</p>
      
      <div class="notice-card">
        <strong>Notice details:</strong><br>
        {{MESSAGE}}
      </div>

      <a href="{{ACTION_URL}}" class="cta-button">Contact Support / Manage Account</a>
    </div>
    <div class="footer">
      &copy; 2026 TutorOnline.pk — Account Security & Support.
    </div>
  </div>
</body>
</html>
