<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Demo Class Request</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f1f5f9; font-family: 'Segoe UI', Arial, sans-serif; color: #1e293b; }
    .container { max-width: 600px; margin: 30px auto; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .header { padding: 30px; text-align: center; background-color: #001E2B; border-bottom: 1px solid #0f2d3c; }
    .header img { height: 32px; }
    .content { padding: 40px 30px; text-align: center; }
    .badge-icon { font-size: 48px; margin-bottom: 16px; }
    h1 { margin: 0 0 12px 0; font-size: 24px; font-weight: 700; color: #0f172a; }
    p { margin: 0 0 24px 0; font-size: 15px; line-height: 1.6; color: #475569; }
    .info-card { background-color: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px; padding: 20px; margin-bottom: 24px; text-align: left; }
    .cta-button { display: inline-block; padding: 14px 32px; background-color: #0284C7; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 15px; border-radius: 999px; }
    .footer { padding: 24px 30px; text-align: center; border-top: 1px solid #f1f5f9; font-size: 12px; color: #94a3b8; background-color: #f8fafc; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://tutoronline.pk/light%20logo.svg" alt="TutorOnline.pk">
    </div>
    <div class="content">
      <div class="badge-icon">🎓</div>
      <h1>New Demo Class Requested!</h1>
      <p>Hello {{USER_NAME}}, a parent has requested a trial demo session with you.</p>
      
      <div class="info-card">
        <div style="font-size: 14px; color: #0369a1; line-height: 1.8;">
          <strong>Subject/Level:</strong> {{SUBJECT}}<br>
          <strong>Parent/Student Name:</strong> {{PARENT_NAME}}<br>
          <strong>City/Area:</strong> {{CITY}}
        </div>
      </div>

      <a href="{{ACTION_URL}}" class="cta-button">View Request & Confirm Demo</a>
    </div>
    <div class="footer">
      &copy; 2026 TutorOnline.pk — Demo & Bookings System.
    </div>
  </div>
</body>
</html>
