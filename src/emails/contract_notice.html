<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TutorOnline Platform Notice</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 24px; color: #001E2B;">
  <div style="max-width: 560px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);">
    <div style="text-align: center; margin-bottom: 24px;">
      <img src="https://tutoronline.pk/light%20logo.svg" alt="TutorOnline.pk" style="height: 28px;" />
    </div>
    
    <h2 style="color: #001E2B; font-size: 20px; font-weight: 700; margin-top: 0; margin-bottom: 12px;">
      {{TITLE}}
    </h2>

    <p style="font-size: 15px; color: #475569; line-height: 1.6; margin-bottom: 24px;">
      Hi <strong>{{USER_NAME}}</strong>,
      <br /><br />
      {{MESSAGE}}
    </p>

    <div style="text-align: center; margin-top: 28px; margin-bottom: 28px;">
      <a href="{{ACTION_URL}}" style="display: inline-block; background-color: #00ED64; color: #001E2B; font-weight: 700; font-size: 14px; text-decoration: none; padding: 12px 28px; border-radius: 999px;">
        View Contract Details
      </a>
    </div>

    <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 24px 0;" />

    <p style="font-size: 12px; color: #94a3b8; text-align: center; margin: 0;">
      © 2026 TutorOnline Platform Pakistan. All rights reserved.
    </p>
  </div>
</body>
</html>
